[tool.poetry]
name = "ai-finance-assistant"
version = "0.1.0"
description = "Multi-agent (orchestrator + critic) finance assistant for the Vietnamese market: FastAPI, Gemini, vnstock, Tavily, Qdrant RAG"
authors = ["Hoang Duc Duong <hdduong12123@gmail.com>"]
readme = "README.md"
packages = [{include = "src"}]

[tool.poetry.dependencies]
python = "^3.10"

# Web Framework
fastapi = "^0.109.0"
uvicorn = {extras = ["standard"], version = "^0.27.0"}

# AI/ML
google-generativeai = "^0.3.0"
langchain = "^0.1.0"
langchain-community = "^0.0.10"
langchain-google-genai = "^0.0.6"

# Database
qdrant-client = "^1.7.0"
supabase = "^2.0.0"

# Data Processing
pandas = "^2.0.0"
numpy = "^1.24.0"

# Configuration
pydantic = "^2.5.0"
pydantic-settings = "^2.1.0"
python-dotenv = "^1.0.0"

# Document Processing
pypdf = "^4.0.0"
langchain-text-splitters = "^0.0.1"

# Multi-Agent System Dependencies
aiohttp = "^3.9.0"
vnstock = "^0.2.6"

# Utils
httpx = "^0.26.0"
python-multipart = "^0.0.6"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"
mypy = "^1.7.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
